name: Trivy Nightly Strict

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          scan-ref: observability-starter/sample-app

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sample-app:nightly observability-starter/sample-app
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sample-app:nightly
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
